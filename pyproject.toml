[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imf-fx"
version = "0.1.0"
description = "High-performance Python client for IMF SDMX 3.0 exchange-rate data, with a monthly USD dataset helper."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Cody Wallace" }]

keywords = [
  "imf",
  "sdmx",
  "sdmx-3.0",
  "exchange-rates",
  "fx",
  "polars",
  "development-finance",
  "iati",
  "crs",
  "financial-modeling",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
  "requests>=2.32.0",
  "polars>=1.0.0",
  "pycountry>=24.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "mypy>=1.10.0",
  "build>=1.2.0",
  "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/<YOUR_GITHUB_ORG>/imf-fx"
Repository = "https://github.com/<YOUR_GITHUB_ORG>/imf-fx"
Issues = "https://github.com/<YOUR_GITHUB_ORG>/imf-fx/issues"

# --- Setuptools: src/ layout ---
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"