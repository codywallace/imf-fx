[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imf-fx"
version = "0.2.3"
description = "High-performance Python client for IMF SDMX 3.0 exchange-rate data, with a monthly USD dataset helper."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Cody Wallace", email = "codywallace.dev@gmail.com" }
]

keywords = [
  "imf",
  "sdmx",
  "sdmx-3.0",
  "exchange-rates",
  "fx",
  "polars",
  "development-finance",
  "iati",
  "oecd",
  "crs",
  "financial-modeling",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
  "requests>=2.32.0",
  "polars>=1.0.0",
  "pycountry>=24.0.0",
]

[project.urls]
Homepage = "https://github.com/codywallace/imf-fx"
Repository = "https://github.com/codywallace/imf-fx"
Issues = "https://github.com/codywallace/imf-fx/issues"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.8.4",
  "mypy>=1.10.0",
  "build>=1.2.0",
  "twine>=5.0.0",
  "pre-commit>=3.7.0",
  "jupyterlab>=4.0.0",
  "ipykernel>=6.0.0",
  "bump-my-version>=1.1.1",
]

# =============================
# Setuptools configuration
# =============================

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
imf_fx = ["py.typed"]

# =============================
# Pytest
# =============================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v"]

# =============================
# Ruff (lint + format)
# =============================

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".git",
  "__pycache__",
  "build",
  "dist",
  "*.egg-info",
  ".pytest_cache",
  ".ruff_cache",
  ".mypy_cache",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
]
ignore = [
  "E501",
]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# =============================
# MyPy
# =============================

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false

# =============================
# Bump My Version
# =============================

[tool.bumpversion]
current_version = "0.2.3"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
commit = true
tag = true
tag_name = "v{new_version}"
message = "chore: bump version to {new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
